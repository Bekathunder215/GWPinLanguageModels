    BATCH_SIZE: 64
    BLOCK_SIZE: 256
    MAX_ITERS: 3000
    LEARNING_RATE: 3e-4
    WEIGHT_DECAY: 0.1
    GRAD_CLIP: 1.0

# Prompting scenarios — Scenario 4: output length variation, Scenario 5: temperature variation
# All use the baseline checkpoint (baseline.pt). Baseline point for both = four_mid / five_mid.
prompting_scenarios:
  four_short:
    CHECKPOINT_NAME: "baseline.pt"
    PROMPT: "To be, or not to be"
    MAX_NEW_TOKENS: 50
    TEMPERATURE: 0.5
    TOP_K: 10
    EMISSIONS_DIR: "prompt_four_short"

  four_mid:
    CHECKPOINT_NAME: "baseline.pt"
    PROMPT: "To be, or not to be"
    MAX_NEW_TOKENS: 200
    TEMPERATURE: 0.5
    TOP_K: 10
    EMISSIONS_DIR: "prompt_four_mid"

  four_long:
    CHECKPOINT_NAME: "baseline.pt"
    PROMPT: "To be, or not to be"
    MAX_NEW_TOKENS: 400
    TEMPERATURE: 0.5
    TOP_K: 10
    EMISSIONS_DIR: "prompt_four_long"

  five_low:
    CHECKPOINT_NAME: "baseline.pt"
    PROMPT: "To be, or not to be"
    MAX_NEW_TOKENS: 200
    TEMPERATURE: 0.1
    TOP_K: 10
    EMISSIONS_DIR: "prompt_five_low"

  five_mid:
    CHECKPOINT_NAME: "baseline.pt"
    PROMPT: "To be, or not to be"
    MAX_NEW_TOKENS: 200
    TEMPERATURE: 0.5
    TOP_K: 10
    EMISSIONS_DIR: "prompt_five_mid"

  five_high:
    CHECKPOINT_NAME: "baseline.pt"
    PROMPT: "To be, or not to be"
    MAX_NEW_TOKENS: 200
    TEMPERATURE: 1.5
    TOP_K: 10
    EMISSIONS_DIR: "prompt_five_high"
